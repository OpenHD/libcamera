name: Build RPI

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Upgrade pip tooling
        run: pip install --upgrade pip setuptools wheel && sudo apt install -y qemu-user-static
      - uses: pguyot/arm-runner-action@98b8d5a3228f504a8bd54913ab1e23d70f369c6e
        id: build_image
        with:
          base_image: raspios_lite:2023-05-03
          image_additional_mb: 4000
          bind_mount_repository: true
          import_github_env: true
          commands: |
            REPO_DIR="$(pwd)"
            ls -a
            sudo apt update
            sudo apt install -y \
              libboost-dev git python3-pip ruby-dev libgnutls28-dev openssl libtiff5-dev \
              qtbase5-dev libqt5core5a libqt5gui5 libqt5widgets5 meson libegl1-mesa-dev \
              cmake libboost-program-options-dev libdrm-dev libexif-dev libegl1-mesa-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3-pybind11

            # --- Fix for MarkupSafe/jinja2 build on armhf (upgrade pip inside the VM + pre-pin MarkupSafe)
            python3 -m pip install --upgrade pip setuptools wheel
            python3 -m pip install 'MarkupSafe<3.0'
            python3 -m pip install pyyaml ply jinja2
            python3 -m pip install --upgrade meson

            gem install fpm

            curl -s --compressed "https://arducam.github.io/arducam_ppa/KEY.gpg" | sudo apt-key add -
            sudo curl -s --compressed -o /etc/apt/sources.list.d/arducam_list_files.list "https://arducam.github.io/arducam_ppa/arducam_list_files.list"
            sudo apt update
            apt-cache madison arducam-pivariety-sdk-dev

            sudo apt install -y arducam-pivariety-sdk-dev=1.0.5

            mkdir -p /opt/libcamera-openhd
            meson build --buildtype=release -Dpipelines=rpi/vc4 -Dipas=rpi/vc4 -Dv4l2=true -Dgstreamer=enabled -Dtest=false -Dlc-compliance=disabled -Dcam=disabled -Dqcam=enabled -Ddocumentation=disabled -Dpycamera=enabled -Dlibexecdir=/usr/lib/arm-linux-gnueabihf --prefix=/usr
            DESTDIR=/opt/libcamera-openhd/ ninja -C build install
            sudo ninja -C build install
            sudo ldconfig
            cp -r tuning/* /opt/libcamera-openhd/usr/share/libcamera/ipa/rpi/vc4/

            # Build the matching upstream camera applications against this
            # OpenHD libcamera build and ship them in the same package. v1.4.2
            # is from the libcamera 0.1.x generation used by this fork. Pin the
            # commit so later rpicam-apps API changes cannot break Bullseye.
            git init /opt/libcamera-apps
            git -C /opt/libcamera-apps fetch --depth 1 https://github.com/raspberrypi/rpicam-apps.git 9ae39f85ae6bee9761c36b9b5b80d675bc1fa369
            git -C /opt/libcamera-apps checkout --detach FETCH_HEAD
            PATCH_FILE=""
            for candidate in \
              "${REPO_DIR}/.github/patches/rpicam-apps-live-bitrate.diff" \
              "$(pwd)/.github/patches/rpicam-apps-live-bitrate.diff" \
              "/libcamera/.github/patches/rpicam-apps-live-bitrate.diff" \
              "${GITHUB_WORKSPACE}/.github/patches/rpicam-apps-live-bitrate.diff"; do
              if [ -n "$candidate" ] && [ -f "$candidate" ]; then
                PATCH_FILE="$candidate"
                break
              fi
            done
            if [ -z "$PATCH_FILE" ]; then
              echo "ERROR: rpicam-apps patch file not found!"
              exit 1
            fi
            echo "Applying patch: $PATCH_FILE"
            git -C /opt/libcamera-apps apply "$PATCH_FILE"
            meson setup /opt/libcamera-apps/build /opt/libcamera-apps \
              --buildtype=release --prefix=/usr \
              -Denable_libav=false -Denable_qt=false \
              -Denable_opencv=false -Denable_tflite=false
            DESTDIR=/opt/libcamera-openhd/ ninja -C /opt/libcamera-apps/build install

            sudo apt download arducam-pivariety-sdk-dev
            dpkg -x arducam-pivariety-sdk-dev*.deb /opt/libcamera-openhd
            rm arducam-pivariety-sdk-dev*.deb

            fpm -a armhf -s dir -t deb -n libcamera-openhd -v 1.2.10 \
              -C /opt/libcamera-openhd -p libcamera-openhd_VERSION_ARCH.deb \
              --depends "libboost-program-options1.74.0" \
              --depends "libdrm2" --depends "libexif12" \
              --depends "libjpeg62-turbo" --depends "libpng16-16" \
              --depends "libtiff5" \
              --conflicts "libcamera-dev" --conflicts "libcamera0" \
              --conflicts "libcamera-apps" --conflicts "libcamera-apps-lite" \
              --conflicts "rpicam-apps"

      - name: Upload to Github
        uses: actions/upload-artifact@v4
        with:
          name: libcamera
          path: |
            /*.deb
            *deb
            *.log

      - name: Push to Cloudsmith
        id: push
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: "release"
          distro: "raspbian"
          release: "bullseye"
          republish: "true"
          file: "*deb"
